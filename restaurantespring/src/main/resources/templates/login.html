<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>Inicio sesión</title>
<main>

	<div th:if="${param.error != null || param.logout != null}" class="alert alert-dismissible fade show" th:classappend="${param.error} ? 'alert-danger' : 'alert-success'" role="alert">
		
		<span th:if="${param.error}">Usuario o contraseña incorrectos</span>
		<span th:if="${param.logout}">Cierre de sesión correcto</span>
		
		<button type="button" class="btn-close" data-bs-dismiss="alert"
			aria-label="Close"></button>
	</div>
	
	<form th:action="@{/login}" method="post">
		<div class="row mb-3">
			<label for="username" class="col-sm-2 col-form-label">Email</label>
			<div class="col-sm-10">
				<input type="email" class="form-control" id="username"
					name="username">
			</div>
		</div>
		<div class="row mb-3">
			<label for="password" class="col-sm-2 col-form-label">Password</label>
			<div class="col-sm-10">
				<input type="password" class="form-control" id="password"
					name="password">
			</div>
		</div>


		<button type="submit" class="btn btn-primary">Iniciar sesión</button>
	</form>

</main>
