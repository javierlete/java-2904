<!DOCTYPE html>
<html class="h-100" th:fragment="plantilla (titulo, contenido)"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-security-extras6">
<head>
<title th:replace="${titulo}">Restaurante Spring</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css"
	href="../static/css/bootstrap.min.css"
	th:href="@{/css/bootstrap.min.css}">
<link rel="stylesheet" type="text/css"
	href="../static/css/bootstrap-icons.min.css"
	th:href="@{/css/bootstrap-icons.min.css}">
<link rel="icon" href="../static/imgs/logo.svg"
	th:href="@{/imgs/logo.svg}">
</head>
<body class="h-100 d-flex flex-column">
	<nav class="navbar navbar-expand-sm bg-dark sticky-top" data-bs-theme="dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="index.html" th:href="@{/}">Restaurante
				Spring</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-sm-0">
					<li class="nav-item"><a class="nav-link" href="index.html"
						th:href="@{/}">Principal</a></li>
				</ul>
				<ul class="navbar-nav mb-2 mb-sm-0">
					<li class="nav-item" sec:authorize="hasRole('ROLE_ADMINISTRADOR')"><a
						class="nav-link" th:href="@{/admin/pedidos}">Pedidos</a></li>
					<li class="nav-item" sec:authorize="hasRole('ROLE_ADMINISTRADOR')"><a
						class="nav-link" th:href="@{/admin/menus}">Menús</a></li>
					<li class="navbar-text" sec:authorize="isAuthenticated()">
						<span sec:authentication="name">ANÓNIMO</span>
					<li class="navbar-text" sec:authorize="isAuthenticated()"><span
						sec:authentication="principal.authorities">NINGÚN ROL</span></li>
					<li class="nav-item" sec:authorize="!isAuthenticated()"><a
						class="nav-link" href="login.html" th:href="@{/login}">Iniciar
							sesión</a></li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<form th:action="@{/logout}" method="post">
							<button class="nav-link">Cerrar sesión</button>
						</form>
					</li>



				</ul>
			</div>
		</div>
	</nav>

	<div class="container flex-grow-1 my-5">
		<main th:replace="${contenido}">CONTENIDO</main>
	</div>

	<footer class="text-bg-dark p-2"> &copy;2026 Javier Lete </footer>

	<script src="../static/js/bootstrap.bundle.min.js"
		th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
