<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

<form th:action="@{/admin/menus/guardar}" method="post" th:object="${menu}">
	<input type="hidden" th:field="*{id}">
	<input th:field="*{nombre}" placeholder="Nombre">
	<input th:field="*{precio}" placeholder="Precio">
	<textarea th:field="*{descripcion}" placeholder="Descripción"></textarea>

	<button>Guardar</button>
</form>

</body>
</html>
