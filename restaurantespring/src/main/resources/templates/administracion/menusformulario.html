<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>Edición de menú</title>
<main>
	<form th:action="@{/admin/menus/guardar}" method="post"
		th:object="${menu}">
		<input type="hidden" th:field="*{id}">

		<div class="row mb-3">
			<label class="col-form-label col-sm-2" for="nombre">Nombre</label>
			<div class="col-sm">
				<input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" th:field="*{nombre}"
					placeholder="Nombre">
				<div class="invalid-feedback" th:errors="*{nombre}"></div>
			</div>
		</div>

		<div class="row mb-3">
			<label class="col-form-label col-sm-2" for="precio">Precio</label>
			<div class="col-sm">
				<input class="form-control" th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" th:field="*{precio}"
					placeholder="Precio">
				<div class="invalid-feedback" th:errors="*{precio}"></div>
			</div>
		</div>

		<div class="row mb-3">
			<label class="col-form-label col-sm-2" for="descripcion">Descripción</label>
			<div class="col-sm">
				<textarea class="form-control" th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'" th:field="*{descripcion}" placeholder="Descripción"></textarea>
				<div class="invalid-feedback" th:errors="*{descripcion}"></div>
			</div>
		</div>

		<button class="btn btn-primary">Guardar</button>
	</form>
</main>
