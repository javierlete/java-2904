<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>Menús</title>
<main>
	<h1>Restaurante Spring Thymeleaf</h1>

	<table class="table table-hover table-striped table-bordered">
		<thead class="table-secondary">
			<tr>
				<th class="text-end">Id</th>
				<th>Nombre</th>
				<th class="text-end">Precio</th>
				<th class="text-center">OPCIONES</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="menu: ${menus}" th:object="${menu}">
				<th class="text-end" th:text="*{id}">1</th>
				<td th:text="*{nombre}">Patatas</td>
				<td class="text-end" th:text="${#numbers.formatCurrency(menu.precio)}">12,34 €</td>
				<td class="text-center"><a class="btn btn-sm btn-primary" href="#" th:href="@{/admin/menus/formulario(id=*{id})}">Editar</a>
					<a class="btn btn-sm btn-danger" href="#" th:href="@{/admin/menus/borrar(id=*{id})}">Borrar</a></td>
			</tr>
		</tbody>
		<tfoot class="table-secondary">
			<tr>
				<td colspan="3"></td>
				<td class="text-center"><a class="btn btn-sm btn-primary" href="#" th:href="@{/admin/menus/formulario}">Añadir</a>
				</td>
			</tr>
		</tfoot>
	</table>
</main>
