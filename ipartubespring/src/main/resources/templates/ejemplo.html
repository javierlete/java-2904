<!DOCTYPE html>
<html th:replace="~{_global :: plantilla(~{::title}, ~{::main})}"
	xmlns:th="https://www.thymeleaf.org">
<title>Ejemplo</title>
<main>
	<h1>
		Hola <span th:text="${nombre}">Juan</span> <span
			th:if="${nombre == 'Javier'}">Profe</span>
	</h1>

	<form>
		<input class="form-control" name="nombre">
		<button class="btn btn-primary">Salúdame</button>
	</form>

	<ul class="list-unstyled">
		<li th:each="u: ${usuarios}" th:text="${u.nombre}">Dato</li>
	</ul>
</main>
</html>
